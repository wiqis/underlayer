# Verification-only CI. It provisions TCCCompiler, builds the server AND the
# separate @test application, boots the server on a free port with a disposable
# database, runs the endpoint matrix, the Chemical suite and the served-artifact
# checkers. It does NOT deploy, publish, push, or use any secret. The founder
# deploys manually.
#
# COMPILER PROVISIONING (two supported paths, no secrets either way)
#   1. Self-hosted / pre-provisioned runner: set the CHEMICAL_ROOT repository
#      variable (or pass `compiler_root` to workflow_dispatch) to a directory
#      whose cmake-build-debug/ holds TCCCompiler.exe. The source-build steps
#      are skipped in that case.
#   2. Stock windows-latest (default): checkout the PUBLIC compiler source at
#      the pinned CHEMICAL_REF, restore a cached build if one exists, otherwise
#      run its own scripts/setup.sh (libtcc + submodules), configure with CMake
#      + Ninja and build the TCCCompiler target. The compiler binary is cached
#      by pinned ref, so this full build happens once per ref.
#   No token or secret is passed to any checkout: the Chemical repo is public
#   and `persist-credentials: false` is set. `contents: read` only.
#
# HONEST LIMITS
#   * Single platform: windows-latest, where the compiler is verified here.
#   * No browser in CI: theme_check.py runs its full static contract. The
#     Playwright proof runs locally with `python tools/theme_check.py BASE
#     --browser`.
#   * helpful_dedupe_check.py WRITES to the disposable ci-underlayer.db. It
#     registers two throwaway learners; never point it at production.
#   * bridge_probe.py sends three SAFE POSTs (bad-token bridge, no-token
#     bridge, unknown route). No registration, no votes, no progress writes.
#     The live-site probe is opt-in locally (`--deployed`) and is not in CI.
#
# NEGATIVE CASE for each CI checker (how we know it can fail):
#   journey_quality_check  remove a journey runtime marker from a served page
#                          -> that lesson FAILs; `--lessons elf:no-such` also
#                          fails with a fetch error.
#   theme_check            tools/checker_nonvacuity.py::check_theme makes
#                          render_theme_boot_js a no-op in a disposable COPY,
#                          rebuilds and confirms this checker fails.
#   lesson_pager_check     checker_nonvacuity.py::check_lesson_pager reintroduces
#                          the subview() length-vs-end-index bug in a copy.
#   helpful_dedupe_check   point it at a server without the helpful route, or
#                          remove the per-learner dedupe and the second vote
#                          stops answering duplicate:true.
#   bridge_probe           remove /api/auth/from-account -> both bridge checks
#                          FAIL with 404 (see the tool's docstring).
#   check_inline_string_temporaries  a planted &string("...") in production
#                          source -> that file FAILs; tests/ is excluded with a
#                          named owner (see docs/deployment.md H4 inventory).
#   security_header_coverage --selftest serves a headerless frozen page (the
#                          exact H3 defect) and requires a FAIL while a
#                          complete-contract control must PASS.
#   lesson_pager_check     checker_nonvacuity.py::check_lesson_pager plants a
#                          LENGTH passed to subview() (the shipped truncation
#                          bug); the checker must name `truncated` and fail.
# A check that cannot fail is decoration. Prove it before trusting a green run.

name: ci

on:
  push:
  pull_request:
  schedule:
    # 03:17 UTC daily. Nightly live gates; the founder deploys manually.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      compiler_root:
        description: 'Directory containing cmake-build-debug/TCCCompiler.exe (self-hosted path)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      # Set CHEMICAL_ROOT once for a self-hosted runner; workflow_dispatch can
      # override it per run. scripts/_common.sh honours the same variable.
      CHEMICAL_ROOT: ${{ inputs.compiler_root || vars.CHEMICAL_ROOT || '' }}
      # Pinned compiler source commit (origin/main at the time of pinning).
      # Override with a repository variable to test a different compiler.
      CHEMICAL_REF: ${{ vars.CHEMICAL_REF || '7a2da4173d49678bdf6c32e4a1ff7ddaba32d240' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # MSVC toolchain is only needed for the source-build path.
      - name: Set up MSVC (source build only)
        if: env.CHEMICAL_ROOT == ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout pinned Chemical compiler source
        if: env.CHEMICAL_ROOT == ''
        uses: actions/checkout@v4
        with:
          repository: chemicallang/chemical
          ref: ${{ env.CHEMICAL_REF }}
          path: chemical-src
          submodules: recursive
          persist-credentials: false

      - name: Restore cached TCCCompiler
        if: env.CHEMICAL_ROOT == ''
        id: tcc-cache
        uses: actions/cache@v4
        with:
          path: |
            chemical-src/cmake-build-debug/TCCCompiler.exe
            chemical-src/cmake-build-debug/TCCCompiler.pdb
            chemical-src/lib/tcc
          key: tcc-${{ runner.os }}-${{ env.CHEMICAL_REF }}

      - name: Build TCCCompiler from pinned source
        if: env.CHEMICAL_ROOT == '' && steps.tcc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd chemical-src
          # Downloads libtcc and initialises submodules (public, no secrets).
          bash scripts/setup.sh --arch x64
          cmake -S . -B cmake-build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON
          cmake --build cmake-build-debug --config Debug --target TCCCompiler -j 4

      - name: Locate TCCCompiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          compiler=""
          if [ -n "${CHEMICAL_ROOT:-}" ]; then
            for dir in cmake-build-debug build .; do
              for name in TCCCompiler.exe TCCCompiler; do
                if [ -f "$CHEMICAL_ROOT/$dir/$name" ]; then compiler="$CHEMICAL_ROOT/$dir/$name"; break 2; fi
              done
            done
            if [ -z "$compiler" ]; then
              echo "::error::No TCCCompiler under CHEMICAL_ROOT=$CHEMICAL_ROOT (checked cmake-build-debug/, build/, .)."
              exit 1
            fi
          elif [ -f chemical-src/cmake-build-debug/TCCCompiler.exe ]; then
            compiler="$PWD/chemical-src/cmake-build-debug/TCCCompiler.exe"
          fi
          if [ -z "$compiler" ]; then
            echo "::error::TCCCompiler was neither provisioned from CHEMICAL_REF=$CHEMICAL_REF nor found under CHEMICAL_ROOT."
            exit 1
          fi
          echo "Using compiler: $compiler"
          echo "Compiler source pin: $CHEMICAL_REF (or CHEMICAL_ROOT override)"
          sha256sum "$compiler" | tee build/compiler.sha256 || true
          echo "UL_COMPILER=$compiler" >> "$GITHUB_ENV"

      - name: Build server (-bm-modules --no-cache)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$UL_COMPILER" chemical.mod -o build/underlayer-verify.exe -bm-modules --no-cache

      - name: Build ELF static pages
        shell: bash
        run: bash scripts/build_static.sh elf --quiet

      - name: Build test application (@test suite, no --test)
        shell: bash
        run: |
          set -euo pipefail
          # Separate application (tests/chemical.mod). `--test` is global and
          # reaches dependency modules, so it must NOT be used here.
          "$UL_COMPILER" tests/chemical.mod -o build/tests-verify.exe --no-cache
          test -s build/tests-verify.exe

      - name: Start server on a free port
        shell: bash
        run: |
          set -euo pipefail
          PORT="$(python -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1]);s.close()")"
          export BASE="http://localhost:$PORT"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          rm -f ci-underlayer.db ci-underlayer.db-shm ci-underlayer.db-wal
          PORT="$PORT" DATABASE_URL=./ci-underlayer.db COURSES_DIR=./courses \
            ./build/underlayer-verify.exe > build/ci-server.log 2>&1 &
          echo $! > build/ci-server.pid
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 5 "$BASE/api/health" > /dev/null 2>&1; then
              echo "server healthy on $BASE"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become healthy; tail of build/ci-server.log:"
          tail -40 build/ci-server.log || true
          exit 1

      - name: Endpoint matrix
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /api/health \
            / \
            /api/courses \
            /courses/elf \
            /courses/elf/lessons/bytes \
            /api/courses/elf/lessons/bytes/units; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 10 "$BASE$path")"
            echo "  $code  $path"
            [ "$code" = "200" ] || { echo "::error::$path answered $code"; exit 1; }
          done

      - name: Chemical @test suite (summary gate)
        shell: bash
        run: |
          set -uo pipefail
          # The runner returns 0 even when tests fail. The exit code is NOT a
          # pass/fail signal: capture the run and parse its Summary line, the
          # same way Web/123Mind/scripts/test.sh does.
          ./build/tests-verify.exe 2>&1 | tee build/chemical-tests.log || true
          sed -e 's/\x1b\[[0-9;]*m//g' build/chemical-tests.log > build/chemical-tests.stripped.log
          failed="$(grep -oE '[0-9]+ failed' build/chemical-tests.stripped.log | tail -1 | grep -oE '^[0-9]+' || true)"
          total="$(grep -oE '[0-9]+ tests' build/chemical-tests.stripped.log | tail -1 | grep -oE '^[0-9]+' || true)"
          if [ -z "$failed" ] || [ -z "$total" ]; then
            echo "::error::no test summary line in build/chemical-tests.stripped.log; the run did not complete."
            exit 1
          fi
          echo "Chemical suite summary: $total tests, $failed failed"
          if [ "$total" -eq 0 ]; then
            echo "::error::the suite reported 0 tests; a vacuous run is not a pass."
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed chemical test(s) failed; see build/chemical-tests.stripped.log"
            exit 1
          fi

      - name: Static / semantic gates (per push)
        shell: bash
        run: |
          set -euo pipefail
          # H4: these read source only. No server, no DB, no secrets.
          python tools/check_inline_string_temporaries.py
          python tools/sqli_scan.py
          python tools/bracecheck.py
          python tools/html_balance.py
          python tools/check_quotes.py
          python tools/js_escape_check.py
          # Negative cases for all six, against disposable copies of the tree.
          # A dedicated runner: checker_nonvacuity.py also contains four live
          # plants whose controls are red on a clean local tree, and failing
          # those on every push would make the gate useless. They are
          # certified in the nightly job with named exclusions in §5c.
          python tools/static_gate_negative_cases.py

      - name: Served-artifact checkers
        shell: bash
        run: |
          set -euo pipefail
          python tools/journey_quality_check.py "$BASE" --all --workers 8
          python tools/theme_check.py "$BASE"
          python tools/lesson_pager_check.py "$BASE"
          python tools/helpful_dedupe_check.py "$BASE"
          python tools/bridge_probe.py "$BASE"
          # H3: header parity across frozen pages, assets and the 404.
          python tools/security_header_coverage.py "$BASE"
          # I2: a literal route must not be captured by an earlier pattern.
          python tools/literal_route_shadow_check.py --selftest
          python tools/literal_route_shadow_check.py
          # I1: sitemap/robots/canonical/JSON-LD over the generated URL list.
          python tools/seo_surface_check.py --selftest
          python tools/seo_surface_check.py "$BASE"
          # I14: course landing parity with the API. `--allow-uniform pe` is an
          # explicit, dated exception pending the PE per-concept minute fix (I14).
          python tools/course_landing_contract.py --selftest
          python tools/course_landing_contract.py --base "$BASE" \
            --allow-uniform pe
          # C1: generated graded banks are a hard gate.
          python tools/verify_graded_banks.py
          # NOTE: I9's anonymous_surface_check and H12's verify_course_bytes are
          # deliberately NOT wired as green gates yet: the former still finds 13
          # unmarked endpoints, the latter has six pre-existing specimen-blocked
          # harnesses. Wire them only when their own acceptance criteria pass.
          # B7: empty-bucket probe on this job's disposable DB. The
          # deployed two-network half is a founder action, NOT in CI.
          python tools/rate_limit_deployed_probe.py --local --port "$PORT" \
            --reset-db ./ci-underlayer.db

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f build/ci-server.pid ]; then
            pid="$(cat build/ci-server.pid)"
            kill "$pid" 2>/dev/null || true
            taskkill //F //PID "$pid" 2>/dev/null || true
          fi

  nightly-live-gates:
    # Wave 1 P0 H4: the live corpus runs nightly on a disposable DB. Each job
    # gets its own checkout and its own ci-underlayer.db, so a write probe can
    # never touch a developer's local database. Logs remain on the run page.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CHEMICAL_ROOT: ${{ inputs.compiler_root || vars.CHEMICAL_ROOT || '' }}
      CHEMICAL_REF: ${{ vars.CHEMICAL_REF || '7a2da4173d49678bdf6c32e4a1ff7ddaba32d240' }}
      # H4: the live gate tools read the same disposable DB the server writes.
      # Without this they fall back to underlayer.db and assert against a
      # different file, which looks like a product failure but is a harness bug.
      DATABASE_URL: ./ci-underlayer.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up MSVC (source build only)
        if: env.CHEMICAL_ROOT == ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Checkout pinned Chemical compiler source
        if: env.CHEMICAL_ROOT == ''
        uses: actions/checkout@v4
        with:
          repository: chemicallang/chemical
          ref: ${{ env.CHEMICAL_REF }}
          path: chemical-src
          submodules: recursive
          persist-credentials: false
      - name: Restore cached TCCCompiler
        if: env.CHEMICAL_ROOT == ''
        id: tcc-cache-nightly
        uses: actions/cache@v4
        with:
          path: |
            chemical-src/cmake-build-debug/TCCCompiler.exe
            chemical-src/cmake-build-debug/TCCCompiler.pdb
            chemical-src/lib/tcc
          key: tcc-${{ runner.os }}-${{ env.CHEMICAL_REF }}
      - name: Build TCCCompiler from pinned source
        if: env.CHEMICAL_ROOT == '' && steps.tcc-cache-nightly.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd chemical-src
          bash scripts/setup.sh --arch x64
          cmake -S . -B cmake-build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON
          cmake --build cmake-build-debug --config Debug --target TCCCompiler -j 4
      - name: Locate TCCCompiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          compiler=""
          if [ -n "${CHEMICAL_ROOT:-}" ]; then
            for dir in cmake-build-debug build .; do
              for name in TCCCompiler.exe TCCCompiler; do
                if [ -f "$CHEMICAL_ROOT/$dir/$name" ]; then compiler="$CHEMICAL_ROOT/$dir/$name"; break 2; fi
              done
            done
          elif [ -f chemical-src/cmake-build-debug/TCCCompiler.exe ]; then
            compiler="$PWD/chemical-src/cmake-build-debug/TCCCompiler.exe"
          fi
          if [ -z "$compiler" ]; then
            echo "::error::TCCCompiler unavailable"
            exit 1
          fi
          echo "UL_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Build server and start on disposable DB
        shell: bash
        run: |
          set -euo pipefail
          "$UL_COMPILER" chemical.mod -o build/underlayer-nightly.exe -bm-modules --no-cache
          PORT="$(python -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1]);s.close()")"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "BASE=http://localhost:$PORT" >> "$GITHUB_ENV"
          rm -f ci-underlayer.db ci-underlayer.db-shm ci-underlayer.db-wal
          PORT="$PORT" DATABASE_URL=./ci-underlayer.db COURSES_DIR=./courses \
            ./build/underlayer-nightly.exe > build/nightly-server.log 2>&1 &
          echo $! > build/nightly-server.pid
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 5 "$BASE/api/health" > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "::error::server did not become healthy"
          tail -40 build/nightly-server.log || true
          exit 1
      - name: Live gate corpus (disposable DB)
        shell: bash
        run: |
          set -euo pipefail
          python tools/security_check.py --port "$PORT"
          # The route count comes from the CURRENT binary's registrations, not
          # the stale "180"; route_check.py parses app/main.ch itself and now
          # finds 187. A mismatch is a finding, linked from docs/deployment.md.
          python tools/route_check.py --port "$PORT" --quiet
          python tools/integration_check.py --base "$BASE"
          python tools/checker_nonvacuity.py
      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f build/nightly-server.pid ]; then
            pid="$(cat build/nightly-server.pid)"
            kill "$pid" 2>/dev/null || true
            taskkill //F //PID "$pid" 2>/dev/null || true
          fi
