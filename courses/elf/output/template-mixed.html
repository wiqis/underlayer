<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="data:,"><title>Concept Title — Underlayer</title><style>.lesson { max-width:860px;margin:0 auto;padding:2rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.7;color:#111827; }.lesson-meta { color:#6b7280;font-size:0.875rem;margin-bottom:2rem; }.unit { margin-bottom:2rem;padding:1.5rem;border-radius:8px;border-left:4px solid; }.unit-why { border-color:#3b82f6;background: #eff6ff; }.unit-model { border-color:#059669;background: #ecfdf5; }.unit-retrieve { border-color:#06b6d4;background: #ecfeff; }.unit-apply { border-color:#f97316;background: #fff7ed; }.unit-connect { border-color:#10b981;background: #ecfdf5; }h1 { font-size:1.75rem;margin-bottom:0.5rem; }h2 { font-size:1.15rem;margin-bottom:0.75rem;margin-top:0; }p { margin:0.5rem 0; }.viz-wrap { margin:0 auto 2rem auto;max-width:820px;background: #1e1e1e;color:#d4d4d4;border-radius:10px;padding:1.25rem; }.viz-controls { display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem; }.viz-btn { background: #374151;color:#d4d4d4;border:none;border-radius:6px;padding:0.4rem 0.9rem;cursor:pointer;font-size:0.85rem; }.viz-btn:hover { background: #4b5563; }.viz-caption { font-size:0.85rem;color:#9ca3af; }.viz-stage { min-height:140px;font-family:ui-monospace,monospace;background: #111827;border-radius:6px;padding:1rem;overflow-x:auto; }.quiz { margin-top:1rem; }.quiz-option { display:block;width:100%;padding:0.75rem 1rem;margin:0.5rem 0;border:1px solid #d1d5db;border-radius:6px;background: white;cursor:pointer;text-align:left;font-size:0.95rem; }.quiz-option:hover { border-color:#3b82f6;background: #eff6ff; }.quiz-option.correct { border-color:#059669;background: #ecfdf5; }.quiz-option.wrong { border-color:#dc2626;background: #fef2f2; }.quiz-option:disabled { cursor:default; }.quiz-feedback { margin-top:0.75rem;font-size:0.9rem;min-height:1.5rem; }</style></head><body><div class="lesson template-mixed"><h1>Concept Title</h1><div class="lesson-meta">20 min &#183; Mixed &#183; Module X of Y</div><div class="unit unit-why"><h2>Why This Matters</h2><p>The problem this concept solves.</p></div><div class="unit unit-model"><h2>A Simple Model</h2><p>The simplified model before the full detail.</p></div><div class="viz-wrap" id="viz"><div class="viz-controls"><button class="viz-btn" onclick="vizStep(-1)">&#9664; Back</button><button class="viz-btn" onclick="vizStep(1)">Next &#9654;</button><span class="viz-caption" id="viz-caption">Step 1 of 2</span></div><div class="viz-stage" id="viz-stage">Visualization goes here.</div></div><div class="unit unit-retrieve"><h2>Check Your Understanding</h2><div class="quiz" id="quiz-1"><button class="quiz-option" data-correct="true" data-explain="Why this option is right." onclick="checkQuiz(&#39;quiz-1&#39;, this)">Correct option</button><button class="quiz-option" data-correct="false" data-explain="Why this option is wrong." onclick="checkQuiz(&#39;quiz-1&#39;, this)">Wrong option</button><div class="quiz-feedback"></div></div></div><div class="unit unit-apply"><h2>Apply It</h2><div class="quiz" id="quiz-2"><button class="quiz-option" data-correct="false" data-explain="Why this option is wrong." onclick="checkQuiz(&#39;quiz-2&#39;, this)">Wrong option</button><button class="quiz-option" data-correct="true" data-explain="Why this option is right." onclick="checkQuiz(&#39;quiz-2&#39;, this)">Correct option</button><div class="quiz-feedback"></div></div></div><div class="unit unit-connect"><h2>Connect</h2><p>How this concept links to the next one.</p></div></div><script>var vizSteps = ['Step 1 content', 'Step 2 content'];var vizIndex = 0;function vizRender(){var stage = document.getElementById('viz-stage');var caption = document.getElementById('viz-caption');if(stage)stage.textContent = vizSteps[vizIndex];if(caption)caption.textContent = 'Step ' + vizIndex + 1 + ' of ' + vizSteps.length;}function vizStep(delta){vizIndex = vizIndex + delta + vizSteps.length % vizSteps.length;vizRender();}vizRender();function checkQuiz(quizId, btn){var quiz = document.getElementById(quizId);var options = quiz.querySelectorAll('.quiz-option');var feedback = quiz.querySelector('.quiz-feedback');for(var i = 0; i < options.length; i++){options[i].disabled = true;}var correct = btn.getAttribute('data-correct') === 'true';var explain = btn.getAttribute('data-explain') || '';if(correct){btn.classList.add('correct');feedback.textContent = 'Correct! ' + explain;feedback.style.color = '#059669';} else {btn.classList.add('wrong');feedback.textContent = 'Not quite. ' + explain;feedback.style.color = '#dc2626';}}</script></body></html>
